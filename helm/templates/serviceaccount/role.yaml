apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentstack.fullname" . }}-role
  labels:
    {{- include "agentstack.labels" . | nindent 4 }}
rules:
  # Permissions for deployments (CRUD)
  - apiGroups: [ "apps" ]
    resources: [ "deployments" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]

  - apiGroups: [ "apps" ]
    resources: [ "deployments/finalizers" ]
    verbs: [ "update" ]

  - apiGroups: ["batch"]
    resources: ["jobs/finalizers"]
    verbs: ["update"]

  - apiGroups: [ "batch" ]
    resources: [ "jobs" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]

  # Permissions for services (CRUD)
  - apiGroups: [ "" ]
    resources: [ "services" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]

  # Permissions for secrets (CRUD)
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "create", "update", "patch", "get", "list", "watch", "delete" ]

  # Permissions for pods (list, logs, and stdio connector pods)
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "create", "delete", "get", "list", "watch" ]

  # Permissions for pod logs
  - apiGroups: [ "" ]
    resources: [ "pods/log" ]
    verbs: [ "get" ]

  # Permissions for pod attach (stdio connectors)
  - apiGroups: [ "" ]
    resources: [ "pods/attach" ]
    verbs: [ "create", "get" ]

  # Permissions for events (read-only)
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "get", "list", "watch" ]

  # Permissions for managing RBAC resources (for stdio connector supergateway pods)
  - apiGroups: [ "" ]
    resources: [ "serviceaccounts" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]

  - apiGroups: [ "rbac.authorization.k8s.io" ]
    resources: [ "roles", "rolebindings" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]